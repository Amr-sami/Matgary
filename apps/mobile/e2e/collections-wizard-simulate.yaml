# Collections (M2) — the automation wizard to `done` through the dev simulate
# knob, then the device revoke (doc 15 spec 15 §4.5.7; spec 09 §4.6, §5 steps
# 13–15; 15 acceptance 13).
#
# One file, both platforms. Needs :3003 with COLLECTIONS_INGEST_ENABLED=on
# (setup NEED=ingest refuses otherwise); the fixture accounts give
# activeAccounts ≥ 1 (09 §4.6.1 rule 2).
#
# - Android (M4 dev client, spec 11's listener module linked): 09 §4.6.1
#   resolves `android_listener`. The flow walks every step that runs without
#   granting real notification access: intro → consent (scrolled) → agree →
#   device (run-unique label) → create (201 + `configure()`) → install, where
#   it asserts the access screen (open-access button, "not connected", Next
#   disabled until access, 09 As landed M4 deviation 4) and that "Open
#   notification access" lands on Android's own detail screen for TheStoro,
#   then comes back. Granting is a system toggle the flow does not flip
#   (`cmd notification allow_listener` is adb, not Maestro; the M4 hand run
#   covers grant → enable → verify → done, audit/t1-m4/results.md 2.4–2.6).
#   If access is already granted on the device (a hand run left it on), the
#   install step shows "connected" and Next enabled instead; both are
#   accepted. Then the shared step 10 unlinks the device. The pre-M4 branch
#   (`unsupported/android_pending`, no device) is gone with the old build.
# - iOS: intro → consent (scrolled, 09 §4.6.3) → agree → device (a run-unique
#   label "E2E wizard <stamp>") → create → install: share the token (the share
#   sheet's Copy returns Share.sharedAction) → open the shortcut link (Safari;
#   dev link COLLECTIONS_IOS_SHORTCUT_URL_LEGACY = the FN-6 placeholder
#   …/shortcuts/devtest, UNVERIFIED) → `launchApp` with stopApp: false brings
#   the SAME process back (the token lives only in memory, 09 §4.6.4, and the
#   simulate knob needs it) → enable → verify → `collection-automation-test-
#   simulate` (__DEV__ only) posts one `test: true` message with the token →
#   `done` → finish → hub. Then Linked phones → unlink → gone from the list,
#   `revokedAt` set on the server.
#   The simulator must run iOS ≤ 26 (the legacy shortcut link is the one set
#   in dev; on an iOS 27 runtime COLLECTIONS_IOS_SHORTCUT_URL is empty and the
#   wizard resolves `unsupported/link_missing`).
#
# VERIFIED (T1 iOS, iPhone 17 Pro / iOS 26.3): the share sheet offers Copy and
# returns sharedAction (09 §4.6.5 `tokenDelivered`) — tapped by point, see
# step 7. The RN Alert's "Unlink" button is told apart from the row's own
# "Unlink" behind it (same label, as in collections-accounts' archive) by
# position, see step 10.
appId: com.thestoro.app
---
# 1. Setup (ingest).
- runScript:
    file: helpers/collections-api.js
    env:
      MODE: setup
      NEED: ingest

# 2. Launch, login guard.
- launchApp
- runFlow: helpers/dev-launcher.yaml
- extendedWaitUntil:
    visible:
      text: "المزيد|More|تسجيل الدخول|Sign in"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "login-identifier"
    file: login.yaml

# 3. Open the wizard from the hub, the way a person gets there (step root
#    testID = collection-automation-<step>). A deep link straight to
#    /settings/collections/automation leaves no hub under it in the settings
#    Stack, so `finish` (goBack(HUB) → router.back()) popped to the previous
#    TAB (More) and step 9 never saw the hub (T1 iOS rerun 2).
- runFlow: helpers/dismiss-logbox.yaml
- openLink: "matgary://settings/collections"
# Both platforms: the centring swipes moved the hub while it was still laying
# out, and the tap landed on the late-alert minutes field (keyboard up, still
# on the hub; T3 Android run 1, T3 iPhone run 1). Drag in the gutter
# (helpers/swipe-to.yaml), let it settle, tap, and once more if the wizard is
# not up — on iOS put the number pad away first (tap the field's label).
- runFlow:
    file: helpers/swipe-to.yaml
    env:
      ID: "collections-settings-automation"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "collections-settings-automation"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible:
        id: "collection-automation-(intro|unsupported)"
    commands:
      - runFlow:
          file: helpers/keyboard-down-ios.yaml
          env:
            ID: "collections-settings-stale_after_minutes"
      - runFlow:
          file: helpers/swipe-to.yaml
          env:
            ID: "collections-settings-automation"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: "collections-settings-automation"
- extendedWaitUntil:
    visible:
      id: "collection-automation-(intro|unsupported)"
    timeout: 30000

# 4. Android (M4): intro → consent → device → install, without granting access.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: "collection-automation-intro"
      - tapOn:
          id: "collection-automation-next"
      - extendedWaitUntil:
          visible:
            id: "collection-automation-consent"
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: "collection-consent-agree"
          direction: DOWN
          centerElement: true
          timeout: 30000
      - tapOn:
          id: "collection-consent-agree"
      - extendedWaitUntil:
          visible:
            id: "collection-device-label"
          timeout: 15000
      # The prefilled "{name} — {model}" may be right- or left-aligned: tap
      # each end and erase, so whichever end the caret lands on, the text goes.
      - tapOn:
          id: "collection-device-label"
          point: "99%,50%"
      - eraseText: 80
      - tapOn:
          id: "collection-device-label"
          point: "1%,50%"
      - eraseText: 80
      - inputText: "E2E wizard ${output.stamp}"
      - assertVisible:
          id: "collection-device-label"
          text: "E2E wizard ${output.stamp}"
      # A drag that starts on the label field does not scroll (T1 F4): use the gutter.
      - runFlow:
          file: helpers/swipe-to.yaml
          env:
            ID: "collection-automation-next"
      - tapOn:
          id: "collection-automation-next"
      - extendedWaitUntil:
          visible:
            id: "collection-automation-android-install"
          timeout: 30000
      - runScript:
          file: helpers/collections-api.js
          env:
            MODE: expect
            CHECK: deviceByLabel
            LABEL: "E2E wizard ${output.stamp}"
      # configure() done (the spinner gives way to the button) and the access state read.
      - extendedWaitUntil:
          visible:
            id: "collection-automation-android-(not-connected|connected)"
          timeout: 30000
      - assertVisible:
          id: "collection-automation-open-access"
      - runFlow:
          when:
            visible:
              id: "collection-automation-android-not-connected"
          commands:
            # Next stays disabled until access is on (09 As landed M4,
            # deviation 4). The id sits on a wrapper View (StepFrame), whose
            # `enabled` is always true, so check the behaviour: a tap leaves
            # the wizard on install.
            - runFlow:
                file: helpers/swipe-to.yaml
                env:
                  ID: "collection-automation-next"
            - tapOn:
                id: "collection-automation-next"
            - waitForAnimationToEnd:
                timeout: 3000
            - assertVisible:
                id: "collection-automation-android-install"
            - assertNotVisible:
                id: "collection-automation-enable"
            # "Open notification access" → Android's detail screen for our listener → back.
            - scrollUntilVisible:
                element:
                  id: "collection-automation-open-access"
                direction: UP
                timeout: 15000
            - tapOn:
                id: "collection-automation-open-access"
            - extendedWaitUntil:
                visible:
                  text: "(?i).*(notification access|الوصول إلى الإشعارات).*"
                timeout: 15000
            - assertVisible:
                text: "TheStoro"
            - back
            - extendedWaitUntil:
                visible:
                  id: "collection-automation-android-not-connected"
                timeout: 15000
      - runFlow:
          when:
            visible:
              id: "collection-automation-android-connected"
          commands:
            - runFlow:
                file: helpers/swipe-to.yaml
                env:
                  ID: "collection-automation-next"
            - assertVisible:
                id: "collection-automation-next"

# Steps 5–9 run on iOS only; step 10 (unlink) runs on both.
- runFlow:
    when:
      platform: iOS
    commands:
      # 5. intro → consent → agree (the consent text must be scrolled).
      - assertVisible:
          id: "collection-automation-intro"
      - tapOn:
          id: "collection-automation-next"
      - extendedWaitUntil:
          visible:
            id: "collection-automation-consent"
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: "collection-consent-agree"
          direction: DOWN
          centerElement: true
          timeout: 30000
      - tapOn:
          id: "collection-consent-agree"

      # 6. device: a run-unique label, create (the frame's primary action).
      - extendedWaitUntil:
          visible:
            id: "collection-device-label"
          timeout: 15000
      # The field is prefilled with "{name} — {model}" (longer than the box)
      # and right-aligned: a centre tap parked the caret at the START, so
      # eraseText (backspace) deleted nothing and the label came out
      # "E2E wizard <stamp>Amr Owner — Simulator…" (T1 iOS I4). Tap the
      # box's right end and erase twice: the first round clears up to the
      # visible end, the second the tail that is then right-aligned.
      - tapOn:
          id: "collection-device-label"
          point: "99%,50%"
      - eraseText: 80
      - tapOn:
          id: "collection-device-label"
          point: "99%,50%"
      - eraseText: 80
      - inputText: "E2E wizard ${output.stamp}"
      - assertVisible:
          id: "collection-device-label"
          text: "E2E wizard ${output.stamp}"
      # Keys down: Next (y 530–582 of 874) sat under the keyboard (top ≈ 537)
      # and Maestro still counted it visible, so its tap hit the keys (I4).
      # A person scrolls it up (Screen: automaticallyAdjustKeyboardInsets).
      - runFlow:
          file: helpers/keyboard-down-ios.yaml
          env:
            ID: "collection-device-label"
      - scrollUntilVisible:
          element:
            id: "collection-automation-next"
          direction: DOWN
          centerElement: true
          timeout: 15000
      - tapOn:
          id: "collection-automation-next"
      - extendedWaitUntil:
          visible:
            id: "collection-automation-install"
          timeout: 30000
      - runScript:
          file: helpers/collections-api.js
          env:
            MODE: expect
            CHECK: deviceByLabel
            LABEL: "E2E wizard ${output.stamp}"

      # 7. install: share the token (system share sheet → Copy), open the
      #    link (Safari), come back to the same process, then enable → verify.
      - tapOn:
          id: "collection-automation-share-token"
      - extendedWaitUntil:
          visible:
            text: "(?i)copy|نسخ"
          timeout: 15000
      # The share sheet is a remote (out-of-process) view: XCTest reports its
      # cells in the SHEET's coordinates (Copy at y 322–338) while it is drawn
      # at the bottom of the screen (Copy ≈ y 773–820 of 874), so a text tap
      # on "Copy" hit the dimmed backdrop, the sheet closed with
      # dismissedAction, `shared` stayed false and "I added it" stayed
      # disabled (T1 iOS rerun 2). Tap the Copy action where it is drawn
      # (iPhone 17 Pro, iOS 26.3; checked by hand: the token reached the
      # pasteboard and Share returned sharedAction).
      # The sheet slides up after its cells exist: wait for it to settle (a
      # tap during the slide missed, T1 iOS rerun 3), and tap once more if
      # it is still up.
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          point: "17%,88%"
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible:
              text: "(?i)copy|نسخ"
          commands:
            - tapOn:
                point: "17%,88%"
      - extendedWaitUntil:
          notVisible:
            text: "(?i)copy|نسخ"
          timeout: 10000
      - extendedWaitUntil:
          visible:
            id: "collection-automation-open-link"
          timeout: 15000
      - tapOn:
          id: "collection-automation-open-link"
      - launchApp:
          stopApp: false
      - extendedWaitUntil:
          visible:
            id: "collection-automation-install"
          timeout: 30000
      - scrollUntilVisible:
          element:
            id: "collection-automation-next"
          direction: DOWN
          centerElement: true
          timeout: 15000
      - tapOn:
          id: "collection-automation-next"
      - extendedWaitUntil:
          visible:
            id: "collection-automation-enable"
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: "collection-automation-next"
          direction: DOWN
          centerElement: true
          timeout: 15000
      - tapOn:
          id: "collection-automation-next"
      - extendedWaitUntil:
          visible:
            id: "collection-automation-verify"
          timeout: 15000

      # 8. Simulate the test message (dev only), reach done (verify.ok within
      #    8 s, then done 1.2 s later).
      - scrollUntilVisible:
          element:
            id: "collection-automation-test-simulate"
          direction: DOWN
          centerElement: true
          timeout: 15000
      - tapOn:
          id: "collection-automation-test-simulate"
      - extendedWaitUntil:
          visible:
            id: "collection-automation-done"
          timeout: 15000
      - runScript:
          file: helpers/collections-api.js
          env:
            MODE: expect
            CHECK: deviceSeen
            ID: "${output.devId}"

      # 9. Finish → back on the collections hub.
      # The hub comes back at the scroll offset it was left at (scrolled down
      # to the automation entry, step 3), so its top switch is off screen:
      # the entry row is the hub's signal.
      - tapOn:
          id: "collection-automation-finish"
      - extendedWaitUntil:
          visible:
            id: "collections-settings-automation"
          timeout: 30000

# 10. Both platforms: unlink this phone's device on Linked phones.
- openLink: "matgary://settings/collections/devices"
- scrollUntilVisible:
    element:
      id: "collection-device-revoke-${output.devId}"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "collection-device-revoke-${output.devId}"
- extendedWaitUntil:
    visible:
      text: "(?s)(إلغاء ربط «E2E wizard .*|Unlink .E2E wizard .*)"
    timeout: 10000
# iOS keeps the row's own "إلغاء الربط" (y 411–455) in the hierarchy
# behind the alert, with the same attributes as the alert's button
# (y 510–558), and a bare text tap hit the row's (T1 iOS rerun 5).
# `below: id <row's revoke>` also picked the row's (Maestro's `below`
# compares top edges; the button's inner text starts at y 418),
# `rightOf: Cancel` too (its inner text starts right of Cancel), and
# `childOf` the alert title found nothing (direct children only).
# Maestro lists the row's match first and the alert's second: index 1
# (checked live against the open alert: it tapped [205,510][345,558]).
# A first tap on the open alert was once swallowed (no DELETE reached
# the server, the same alert stayed up); one retry while it shows.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "(?i)إلغاء الربط|unlink"
          index: 1
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible:
              text: "(?s)(إلغاء ربط «E2E wizard .*|Unlink .E2E wizard .*)"
          commands:
            - tapOn:
                text: "(?i)إلغاء الربط|unlink"
                index: 1
# Android's dialog is its own window: the row's button is not a twin in the
# hierarchy (as in collections-accounts' archive), so the plain tap.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "(?i)إلغاء الربط|unlink"
- extendedWaitUntil:
    notVisible:
      id: "collection-device-${output.devId}"
    timeout: 30000
- runScript:
    file: helpers/collections-api.js
    env:
      MODE: expect
      CHECK: deviceRevoked
      ID: "${output.devId}"

# End on the dashboard (both platforms).
- runFlow: helpers/dismiss-logbox.yaml
- tapOn:
    text: "الرئيسية|Home"
- assertVisible:
    text: "أهلاً، .+|Welcome back, .+"
