# Login — from any state to a signed-in dashboard.
#
# Runs against the dev client (com.thestoro.app) on the simulator, backend on
# :3003. The app persists both the session and the locale, so this flow first
# signs out if a session is live, then normalises the locale to Arabic (the
# product default) via the login screen's language toggle, then signs in with
# the seeded owner and asserts the dashboard greeting.
#
# Text selectors are regexes matched against the whole string; "x|y" accepts
# either locale so a flow still runs when the app was last left in English.
# Dev builds prefill the credentials (EXPO_PUBLIC_DEV_IDENTIFIER in .env), so
# both fields are erased before typing to make the login real.
appId: com.thestoro.app
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "المزيد|More|تسجيل الدخول|Sign in"
    timeout: 45000

# Already signed in → More → Sign out (the sign-out row lives on More, at the bottom).
- runFlow:
    when:
      visible:
        text: "المزيد|More"
    commands:
      - tapOn:
          text: "المزيد|More"
      - scrollUntilVisible:
          element:
            text: "تسجيل الخروج|Sign out"
          direction: DOWN
          centerElement: true
          timeout: 20000
      - tapOn:
          text: "تسجيل الخروج|Sign out"

- extendedWaitUntil:
    visible:
      id: "login-identifier"
    timeout: 30000

# Locale left in English by a previous run → the toggle reads "العربية". Tap it.
- runFlow:
    when:
      visible:
        text: "العربية"
    commands:
      - tapOn:
          text: "العربية"
      - extendedWaitUntil:
          visible:
            text: "تصفح المتجر التجريبي"
          timeout: 15000

- assertVisible:
    text: "البريد أو اسم المستخدم"

- tapOn:
    id: "login-identifier"
- eraseText: 80
- inputText: "amr@matgary.local"

- tapOn:
    id: "login-password"
- eraseText: 80
- inputText: "Test1234!"

# Submit from the keyboard: the password field's return key is "go" and is
# wired to signIn. The primary button sits under the keyboard at this point
# (its centre is below the keyboard's top edge), so tapping it lands on the
# keyboard; the return key is the path a person actually uses here.
- pressKey: Enter

- extendedWaitUntil:
    visible:
      text: "أهلاً، .+"
    timeout: 45000
- assertVisible:
    text: "أهلاً، متجر عمرو"
- assertVisible:
    text: "المزيد"
