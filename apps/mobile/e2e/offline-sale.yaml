# Offline sale — ring a sale with the network "down", then sync it (doc 06 §6.5).
#
# Warm the POS caches online → /sync → flip the DEV-ONLY "Simulate
# offline" switch → Sales → add a recent product → Cash → Record sale → the
# card says PENDING (queued, not synced) → /sync → the queued counter
# is not 0 → flip the switch back → Sync now → queued reaches 0.
#
# The switch exists only in a dev bundle (offline/dev-offline.ts, guarded by
# __DEV__); this flow runs against the dev client. Signs in first when the
# app is on the login screen. Leaves the switch OFF and ends on Sync.
appId: com.thestoro.app
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "المزيد|More|تسجيل الدخول|Sign in"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "login-identifier"
    file: login.yaml

# Warm the POS caches (products + recent sales) while still online, so the
# offline ring below reads them from the query cache exactly as a shop that
# lost signal mid-shift would.
- tapOn:
    text: "المبيعات|Sales"
- extendedWaitUntil:
    visible:
      id: "pos-recent-chip"
    timeout: 30000

# /sync → simulate offline.
- runFlow: helpers/dismiss-logbox.yaml
# /sync by deep link: the More tile is gated on a permission name that does
# not exist ("create_sale"; the real one is "record_sales"), so no account
# sees it — the offline chip and the POS card are the in-app ways there.
- openLink: matgary://sync
- extendedWaitUntil:
    visible:
      id: "sync-now"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "sync-simulate-offline"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "sync-simulate-offline"
- scrollUntilVisible:
    element:
      id: "sync-now"
    direction: UP
    centerElement: true
    timeout: 20000
# The store now says offline: the banner is up.
- assertVisible:
    text: "مفيش اتصال بالإنترنت.*|No internet connection.*"

# Sales → add a recent product (fall through to the next chip if the first is out of stock).
- tapOn:
    text: "المبيعات|Sales"
- extendedWaitUntil:
    visible:
      id: "pos-recent-chip"
    timeout: 30000
- tapOn:
    id: "pos-recent-chip"
    index: 0
- runFlow:
    when:
      notVisible:
        id: "pos-cart-totals"
    commands:
      - tapOn:
          id: "pos-recent-chip"
          index: 1
- runFlow:
    when:
      notVisible:
        id: "pos-cart-totals"
    commands:
      - tapOn:
          id: "pos-recent-chip"
          index: 2
- runFlow:
    when:
      notVisible:
        id: "pos-cart-totals"
    commands:
      - tapOn:
          id: "pos-recent-chip"
          index: 3
- scrollUntilVisible:
    element:
      id: "pos-cart-totals"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "pos-cart-totals"

- scrollUntilVisible:
    element:
      text: "كاش|Cash"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: "كاش|Cash"
- scrollUntilVisible:
    element:
      text: "تسجيل الفاتورة|Record sale"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: "تسجيل الفاتورة|Record sale"

# The card: queued, NOT synced (§6.4 — never say synced until the engine does).
- extendedWaitUntil:
    visible:
      id: "pos-sale-result"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "pos-sale-result"
    direction: UP
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "pos-sync-pending"
- assertNotVisible:
    id: "pos-sync-synced"
- assertVisible:
    text: "INV-.*"

# Back to Sync: the queue holds it. Flip the switch off → reconnect drain +
# Sync now → queued reaches 0.
- runFlow: helpers/dismiss-logbox.yaml
# /sync by deep link: the More tile is gated on a permission name that does
# not exist ("create_sale"; the real one is "record_sales"), so no account
# sees it — the offline chip and the POS card are the in-app ways there.
- openLink: matgary://sync
- extendedWaitUntil:
    visible:
      id: "sync-stat-queued-value"
    timeout: 30000
- assertVisible:
    id: "sync-stat-queued-value"
    text: "[1-9][0-9]*"

- scrollUntilVisible:
    element:
      id: "sync-simulate-offline"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "sync-simulate-offline"
- scrollUntilVisible:
    element:
      id: "sync-now"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    id: "sync-now"
- extendedWaitUntil:
    visible:
      id: "sync-stat-queued-value"
      text: "0"
    timeout: 60000
- assertVisible:
    id: "sync-stat-queued-value"
    text: "0"
