plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// Doc 15 spec 11 §4.4: a copy of modules/backup-exclusion/android/build.gradle plus WorkManager and the
// JVM test dependencies. The toolchain (minSdk 24, compile/targetSdk 36, Kotlin 2.1.20) comes from RN
// through the Expo plugin. No new app permission is added (the manifest declares none).
group = 'expo.modules.collectionlistener'
version = '1.0.0'

android {
  namespace "expo.modules.collectionlistener"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation 'androidx.work:work-runtime-ktx:2.9.1'      // D11-c: the version expo-background-task ships
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'                // real org.json for JVM tests (android.jar stubs throw)
}
