# Production stack for a single self-managed VPS behind nginx + Cloudflare.
#
# Differs from docker-compose.yml (a laptop-oriented file) in the ways that
# matter once the host has a public IP:
#   * every published port is bound to 127.0.0.1 — nginx is the only ingress,
#     and ufw only opens 22/80/443 anyway
#   * no default credentials; everything comes from .env
#   * Redis requires a password and runs `noeviction` (see the redis service)
#   * a one-shot `migrate` service, because the app image physically cannot
#     run migrations (see the migrator stage in the Dockerfile)
#   * log rotation on every service, so a chatty container cannot fill the
#     disk out from under Postgres
#
# First boot:
#   docker compose -f docker-compose.prod.yml up -d postgres redis
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d app cron backup
#
# This host also runs unrelated production stacks (jameel, midsync). Ports are
# chosen to avoid theirs: jameel holds 5433/6381/9000-9001/3100/4001.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: matgary-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: matgary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: matgary
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - matgary_pg_data:/var/lib/postgresql/data
      - ./infra/init-postgres-prod.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matgary -d matgary"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Dedicated to Matgary — jameel and midsync keep their own instances.
  #
  # `noeviction` is deliberate and differs from the dev compose file. This one
  # Redis backs both the opportunistic cache AND two BullMQ queues (WhatsApp
  # sends, activity log). Under allkeys-lru, Redis is free to evict live job
  # keys, which BullMQ itself warns about on boot and which silently loses
  # customer messages. Every cache call in lib/cache.ts is wrapped in
  # try/catch, so if memory does fill, cache writes fail closed and the app
  # falls back to Postgres — the queue stays intact. AOF is on for the same
  # reason: a restart must not drop queued jobs.
  redis:
    image: redis:7-alpine
    container_name: matgary-redis
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - matgary_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-shot. Creates/upgrades the schema, provisions the matgary_admin
  # BYPASSRLS role, seeds the bootstrap admin and the plan catalogue.
  # Run it before `up -d app` on first boot and after every deploy that
  # carries new migrations.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: matgary-migrate:latest
    container_name: matgary-migrate
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/web/.env
    environment:
      NODE_ENV: production
      # All four must be rewritten, not just DATABASE_URL. migrate.ts only uses
      # its own DATABASE_URL client, but the seed scripts import @/lib/db and
      # @/lib/redis, which read APP_DATABASE_URL and REDIS_URL — left at their
      # .env values those resolve to this container's own loopback and the
      # script dies partway through with ECONNREFUSED 127.0.0.1:5434.
      DATABASE_URL: postgres://matgary:${POSTGRES_PASSWORD}@postgres:5432/matgary
      APP_DATABASE_URL: postgres://matgary_app:${APP_DB_PASSWORD}@postgres:5432/matgary
      ADMIN_DATABASE_URL: postgres://matgary_admin:${ADMIN_DB_PASSWORD}@postgres:5432/matgary
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: matgary-app:${APP_TAG:-latest}
    container_name: matgary-app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/web/.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # Rewrite every host-targeted URL from .env to compose-network DNS.
      # ADMIN_DATABASE_URL is included on purpose: the dev compose file omits
      # it, so it stays pointed at localhost:543x — which inside the container
      # is its own loopback — and every /admin page plus all 28 /api/admin/*
      # routes fail with ECONNREFUSED.
      DATABASE_URL: postgres://matgary:${POSTGRES_PASSWORD}@postgres:5432/matgary
      APP_DATABASE_URL: postgres://matgary_app:${APP_DB_PASSWORD}@postgres:5432/matgary
      ADMIN_DATABASE_URL: postgres://matgary_admin:${ADMIN_DB_PASSWORD}@postgres:5432/matgary
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Pinned next to the mount below so the two cannot drift; the image's
      # ENV already says the same (Dockerfile runner stage).
      UPLOADS_DIR: /repo/uploads
    volumes:
      # Product / team photos and receipt logos (lib/uploads.ts). A named
      # volume so they survive `up -d --build`; the Dockerfile pre-creates
      # /repo/uploads owned by nextjs, and a named volume copies that
      # ownership on first mount, so the app can write here as uid 1001.
      - matgary_uploads:/repo/uploads
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # /readyz pings Postgres and Redis; /healthz is a static 200 and would
      # keep a wedged process marked healthy.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Pokes the app's internal cron routes. Holds no DB credentials — only the
  # shared bearer token. All eight routes are scheduled here (one per directory
  # in apps/web/app/api/cron); the dev compose file wires only four, which is
  # why admin lockouts are never applied, digests never send, and demo clones
  # accumulate.
  cron:
    image: alpine:3.20
    container_name: matgary-cron
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./logs/cron:/var/log
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      CRON_TARGET_URL: http://app:3000
      RECURRING_EXPENSES_CRON: "0 * * * *"
      ACTIVITY_CLEANUP_CRON: "30 3 * * *"
      TENANT_DELETION_CRON: "0 3 * * *"
      ADMIN_SESSION_CLEANUP_CRON: "*/15 * * * *"
      # Also the push-receipts poller: digest-tick/route.ts ends with
      # drainPushReceipts() (apps/web/lib/push/receipts.ts). A receipt is asked
      # for RECEIPT_DELAY_MS = 15 min after the ticket, so a 15-min tick bounds
      # dead-token detection at ~30 min. Digests stay idempotent (digest_runs
      # unique index). "*/15" lands at most 5 pokes in any sliding hour
      # (:00,:15,:30,:45,:00 at the boundary — lib/ratelimit's window slides,
      # it does not reset), still under the route's 6/h per-IP bucket.
      DIGEST_TICK_CRON: "*/15 * * * *"
      DEMO_CLEANUP_CRON: "15 4 * * *"
      # Drains notification_digest_queue. Its query takes every row where
      # sent_at IS NULL with no age filter, so the cron interval IS the digest
      # period — running it hourly would turn an opt-in daily summary into an
      # hourly one. Once a day, 17:00 UTC = 20:00 Cairo (19:00 outside DST).
      NOTIFICATIONS_DIGEST_CRON: "0 17 * * *"
      # Digital collections (mobile-dev-docs/15-digital-collections, specs 13 + 16):
      # M1 staleSweep + limitSweep; M2 adds silentSourceSweep, rawPurge (raw-message
      # retention: a legal duty, spec 14) and lateRematch. "*/15" lands at most 5
      # pokes in any sliding hour, under guardCronRequest's default 6/h for the
      # "collections-tick" bucket. Never faster; never slower than hourly (retention).
      COLLECTIONS_TICK_CRON: "*/15 * * * *"
      # Notification Center (migration 0069): report.daily/weekly/monthly
      # scheduled sends. reports-tick reads tenant_report_settings and fires
      # whichever reports are enabled at the configured local time. Every 15
      # min so we catch any owner-configured HH:MM within the trailing 14
      # min (route uses `withinTickWindow`). Idempotent — wasAlreadyDispatched
      # prevents duplicates within the period.
      REPORTS_TICK_CRON: "*/15 * * * *"
      # Low-stock sweep — fires inventory.low_stock for every product at or
      # below its threshold, once per calendar day (dedupe keyed on
      # /inventory/<productId>?lowStock=YYYY-MM-DD). Hourly so a mid-day
      # drop-to-threshold doesn't wait until midnight to notify.
      LOW_STOCK_SWEEP_CRON: "0 * * * *"
      # Attendance late-arrival sweep (migration 0069, N2). Checks each
      # enabled employee_schedules row against now-in-tenant-tz:
      # work_day? not on leave? grace expired? fires attendance.late,
      # one notification per employee per day (dedupe via link embedding
      # YYYY-MM-DD). Every 5 min so a late detection arrives promptly.
      ATTENDANCE_LATE_SWEEP_CRON: "*/5 * * * *"
    entrypoint:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache curl tini >/dev/null
        umask 077
        printf 'CRON_SECRET=%s\nCRON_TARGET_URL=%s\n' \
          "$$CRON_SECRET" "$$CRON_TARGET_URL" > /etc/cron-env
        cat > /usr/local/bin/poke-cron.sh <<'WRAPPER'
        #!/bin/sh
        set -e
        . /etc/cron-env
        endpoint="$$1"
        label="$$2"
        curl -fsS -X POST \
          -H "Authorization: Bearer $$CRON_SECRET" \
          "$$CRON_TARGET_URL$$endpoint" \
          | sed "s|^|[cron $$label] |"
        WRAPPER
        chmod 700 /usr/local/bin/poke-cron.sh
        # Every line below is authenticated by CRON_SECRET: poke-cron.sh sends
        # it as "Authorization: Bearer <CRON_SECRET>" and each /api/cron/* route
        # compares it constant-time (apps/web/lib/cron/auth.ts guardCronRequest;
        # recurring-expenses keeps its own copy). One line per directory in
        # apps/web/app/api/cron — a route missing here never runs in prod.
        {
          echo "$$RECURRING_EXPENSES_CRON /usr/local/bin/poke-cron.sh /api/cron/recurring-expenses recurring-expenses >> /var/log/cron.log 2>&1"
          echo "$$ACTIVITY_CLEANUP_CRON /usr/local/bin/poke-cron.sh /api/cron/activity-log-cleanup activity-cleanup >> /var/log/cron.log 2>&1"
          echo "$$TENANT_DELETION_CRON /usr/local/bin/poke-cron.sh /api/cron/tenant-deletion tenant-deletion >> /var/log/cron.log 2>&1"
          echo "$$ADMIN_SESSION_CLEANUP_CRON /usr/local/bin/poke-cron.sh /api/cron/admin-session-cleanup admin-session-cleanup >> /var/log/cron.log 2>&1"
          echo "$$DIGEST_TICK_CRON /usr/local/bin/poke-cron.sh /api/cron/digest-tick digest-tick >> /var/log/cron.log 2>&1"
          echo "$$DEMO_CLEANUP_CRON /usr/local/bin/poke-cron.sh /api/cron/demo-cleanup demo-cleanup >> /var/log/cron.log 2>&1"
          echo "$$NOTIFICATIONS_DIGEST_CRON /usr/local/bin/poke-cron.sh /api/cron/notifications-digest notifications-digest >> /var/log/cron.log 2>&1"
          echo "$$COLLECTIONS_TICK_CRON /usr/local/bin/poke-cron.sh /api/cron/collections-tick collections-tick >> /var/log/cron.log 2>&1"
          echo "$$REPORTS_TICK_CRON /usr/local/bin/poke-cron.sh /api/cron/reports-tick reports-tick >> /var/log/cron.log 2>&1"
          echo "$$LOW_STOCK_SWEEP_CRON /usr/local/bin/poke-cron.sh /api/cron/low-stock-sweep low-stock-sweep >> /var/log/cron.log 2>&1"
          echo "$$ATTENDANCE_LATE_SWEEP_CRON /usr/local/bin/poke-cron.sh /api/cron/attendance-late-sweep attendance-late-sweep >> /var/log/cron.log 2>&1"
        } > /etc/crontabs/root
        echo "[cron] target: $$CRON_TARGET_URL — 11 jobs scheduled"
        exec tini -- crond -f -d 8

  backup:
    image: postgres:16-alpine
    container_name: matgary-backup
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: matgary
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: matgary
      BACKUP_DIR: /backups
      BACKUP_CRON: "30 2 * * *"
      DAILY_KEEP: "14"
      WEEKLY_KEEP: "8"
    volumes:
      - ./infra/backup.sh:/usr/local/bin/backup.sh:ro
      - ./infra/restore.sh:/usr/local/bin/restore.sh:ro
      - ./backups:/backups
      - ./logs/backup:/var/log
      # Read-only view of the uploads volume. backup.sh does not tar it on
      # the nightly schedule (see the note there); the mount is here so a
      # manual snapshot / restore drill can reach the files without exec-ing
      # into the app container.
      - matgary_uploads:/uploads:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "$$BACKUP_CRON /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        if ! ls /backups/*.sql.gz >/dev/null 2>&1; then
          /usr/local/bin/backup.sh || echo "[backup] initial run failed (non-fatal)"
        fi
        echo "[backup] cron schedule: $$BACKUP_CRON"
        exec crond -f -d 8

volumes:
  matgary_pg_data:
  matgary_redis_data:
  matgary_uploads:
